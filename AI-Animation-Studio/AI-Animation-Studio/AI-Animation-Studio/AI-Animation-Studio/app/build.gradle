plugins {
    id 'com.android.application'
}

android {
    namespace 'com.usama.aianimationstudio'
    compileSdk 35
    sourceSets {
    main {
        manifest.srcFile 'AI-Animation-Studio/app/src/main/AndroidManifest.xml'
        java.srcDirs = ['AI-Animation-Studio/app/src/main/AI-Animation-Studio/app/src/main/java']
    }
    }

    defaultConfig {
        applicationId 'com.usama.aianimationstudio'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}
